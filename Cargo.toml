[package]
name = "cli-toolbox"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.10"
crossterm = "0.29.0"
dirs = "7.0.0"
libc = "0.2"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
toml_edit = { version = "0.25.0", features = ["serde"] }
thiserror = "2.0.20"
